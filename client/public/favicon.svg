<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0b3b" />
      <stop offset="100%" stop-color="#0c041d" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Stars / Sparkles -->
  <circle cx="26" cy="30" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="106" cy="40" r="1.2" fill="#fde047" opacity="0.7" />
  <circle cx="34" cy="98" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="100" cy="90" r="1.5" fill="#fde047" opacity="0.8" />

  <!-- Flowing Dor / String Thread -->
  <path d="M 64 88 Q 50 102, 60 114 T 78 124" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85" />

  <!-- Kite Diamond Outer Glow -->
  <polygon points="64,16 104,56 64,88 24,56" fill="url(#crimson)" filter="url(#glow)" opacity="0.25" />

  <!-- Main Kite Body - Left Wing (Crimson) -->
  <polygon points="64,16 24,56 64,88" fill="url(#crimson)" />

  <!-- Main Kite Body - Right Wing (Basant Gold) -->
  <polygon points="64,16 104,56 64,88" fill="url(#gold)" />

  <!-- Upper Curved Bamboo Arch (Tawa) -->
  <path d="M 24 56 Q 64 24, 104 56" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />

  <!-- Center Bamboo Spine (Teer) -->
  <line x1="64" y1="16" x2="64" y2="88" stroke="#1b0b3b" stroke-width="2.2" opacity="0.8" />

  <!-- Tail Triangle (Tukkal / Bottom Fin) -->
  <polygon points="64,88 56,102 72,102" fill="url(#cyan)" />
  <polygon points="64,102 60,110 68,110" fill="#fde047" />

  <!-- Central Emblem / Eye Star -->
  <polygon points="64,50 67,56 73,56 68,60 70,66 64,62 58,66 60,60 55,56 61,56" fill="#ffffff" />
</svg>
